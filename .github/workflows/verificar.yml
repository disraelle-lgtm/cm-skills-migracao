name: verificar
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checagens da skill e do migrador
        run: python tools/verificar.py
